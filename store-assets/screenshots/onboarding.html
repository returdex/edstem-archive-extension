<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthetic Edstem Archive screenshot fixture</title>
    <link rel="stylesheet" href="../../src/styles.css" />
  </head>
  <body class="popup-body">

  <section class="onboarding-shell">
    <p class="eyebrow">Edstem Archive</p>
    <h1>Archive your Edstem discussions</h1>
    <p class="lede">Download accessible course discussions as local Markdown from your own browser session.</p>

    <ul class="trust-list">
      <li>Uses your existing EDstem session</li>
      <li>Saves Markdown locally</li>
      <li>No credential or activity collection</li>
    </ul>

    <button type="button" data-action="open-edstem">Open Edstem</button>
  </section>

  </body>
