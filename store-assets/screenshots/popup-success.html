<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthetic Edstem Archive screenshot fixture</title>
    <link rel="stylesheet" href="../../src/styles.css" />
  </head>
  <body class="popup-body">

    <section class="popup-shell">
      <header class="popup-header">
        <div>
          <p class="eyebrow">Ready</p>
          <h1>Edstem Archive</h1>
        </div>
        <span class="status-pill success">Logged in to EDstem</span>
      </header>

      <section class="action-group" aria-label="Download actions">

    <button type="button" data-action="start-course-export" data-value="synthetic-course-101">Download current course</button>
    <button type="button" data-action="start-all-export">Download all courses</button>
    <button type="button" data-action="open-downloads-folder">Open downloads folder</button>

        <p class="button-note">Markdown files are saved to your browser Downloads folder.</p>
      </section>

      <section class="progress-panel" aria-label="Download result">

      <p class="label">Download result</p>
      <p>12/12 Markdown files downloaded.</p>
      <ul class="course-list"><li><span>Synthetic Design Studio</span><small>downloaded 12 files</small></li></ul>


      </section>

      <p class="privacy-note">No credentials or cookies are collected.</p>
    </section>

  </body>
</html>
